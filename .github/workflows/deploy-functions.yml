name: Deploiement Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'packages/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

# Jeton GitHub en lecture seule : ce workflow ne fait que lire le depot.
permissions:
  contents: read

# Un seul deploiement a la fois (deux pushes rapproches ne se chevauchent pas).
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  # Tests du moteur et de la crypto + typecheck Deno des fonctions : rien ne
  # part en production si l'un d'eux echoue.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Secrets requis : SUPABASE_ACCESS_TOKEN (compte Supabase) et
    # SUPABASE_PROJECT_ID (ref du projet). Les secrets d'execution des fonctions
    # (ENCRYPTION_KEY, ALLOWED_USER_EMAILS, ALLOWED_ORIGINS, ENABLE_BANKING_*,
    # SYNC_CRON_SECRET...) se configurent dans le dashboard Supabase, pas ici.
    # Le jeton de compte n'est expose QU'AUX deux etapes de deploiement, pas aux
    # actions tierces du job (checkout, setup-cli).
    steps:
      - uses: actions/checkout@v4
      # Tant que les secrets ne sont pas configures, on IGNORE proprement le
      # deploiement (CI verte) au lieu de faire echouer le workflow.
      - name: Verifier la configuration
        id: guard
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_PROJECT: ${{ secrets.SUPABASE_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_PROJECT" != "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Secrets SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID absents : deploiement ignore."
            echo "Renseigner ces secrets dans Settings > Secrets and variables > Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.configured == 'true'
        with:
          version: latest
      # Deploie l'Edge Function /api (verify_jwt vient de config.toml). Le CLI
      # (version latest) exige --yes hors terminal et --remote=<ref> remplace
      # --project-ref (deprecie).
      - name: Deployer la fonction api
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy api --remote="$SUPABASE_PROJECT_ID" --yes
      # Deploie l'Edge Function sync-bank (verify_jwt = false via config.toml : la
      # fonction verifie a la main le JWT utilisateur ou le secret x-cron-secret).
      - name: Deployer la fonction sync-bank
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy sync-bank --remote="$SUPABASE_PROJECT_ID" --yes
