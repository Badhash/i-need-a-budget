name: Deploiement GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Moindre privilege : le build (qui execute npm ci et le code des dependances)
# ne recoit qu'un jeton en lecture ; seul le job de deploiement peut ecrire sur
# Pages et demander un jeton OIDC.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer les dependances
        working-directory: app
        run: npm ci
      # Sans ces secrets, le front se construit avec des valeurs placeholder
      # (https://placeholder.supabase.co) : le login echoue avec un CORS Failed
      # trompeur. On echoue tot et clairement plutot que de deployer un front casse.
      - name: Verifier la configuration Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL et/ou SUPABASE_ANON_KEY absents. Ajoute-les dans Settings > Secrets and variables > Actions, puis relance ce workflow."
            exit 1
          fi
      - name: Build
        working-directory: app
        run: npm run build
        env:
          # Valeurs publiques (embarquees dans le bundle) : la cle anon ne donne
          # aucun acces aux tables (RLS + revoke). Definir ces secrets dans
          # Settings > Secrets and variables > Actions.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Identifiant de build (compare a celui du service worker, cf. main.tsx).
          VITE_BUILD_ID: ${{ github.sha }}
      # Le service worker est copie tel quel depuis public/ : on y injecte le
      # meme identifiant pour qu'un deploiement produise un nouveau worker
      # (purge des anciens caches, detection de la nouvelle version).
      - name: Estampiller le service worker
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA}/" app/dist/sw.js && grep -q "$GITHUB_SHA" app/dist/sw.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1